version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Provider and module updates (also refreshes terraform/.terraform.lock.hcl).
  # The PR gets the usual plan check; review the plan comment before merging.
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns:
          - "*"

  # Dev-only tooling for the frontend tests (jsdom). Nothing here is deployed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
