name: Data to S3

# Manual "push only web/data" button. sync-sio.yml also syncs web/data on every merge to main;
# use this when the data pages need redeploying without a full site deploy.
# Run it from main: the deploy role (terraform/iam.tf) only trusts the main branch.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # request the OIDC token to assume the AWS role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BUCKET: sign-in-out.com
      AWS_REGION: ap-southeast-2
      CF_DISTRIBUTION_ID: E2DY5SRXBRDW31

    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Assumes the deploy IAM role via GitHub OIDC; no long-lived keys are stored in GitHub secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::722937635825:role/github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync web/data to S3
        run: aws s3 sync ./web/data/ "s3://$BUCKET/data" --delete --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/data/*"
