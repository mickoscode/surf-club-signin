name: Sync SIO on Merge

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # request the OIDC token to assume the AWS role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUCKET: sign-in-out.com
      AWS_REGION: ap-southeast-2
      CF_DISTRIBUTION_ID: E2DY5SRXBRDW31

    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Generates index/live/history/bulk.html for web/main and every web/<site>/ that has a
      # config.json, and fails on broken symlinks, missing config keys or unreplaced placeholders.
      # inject-config.js uses only built-in modules, so no npm install is needed.
      - name: Build and validate all sites
        run: ./scripts/build-sites.sh

      # Assumes the deploy IAM role via GitHub OIDC (role defined in terraform/iam.tf);
      # no long-lived keys are stored in GitHub secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::722937635825:role/github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # web/main goes to the bucket root; every other web/ folder (data, age-manager and each
      # site with a config.json) goes to its own prefix. The root sync excludes those prefixes
      # so --delete cannot remove them while they are being re-synced.
      - name: Sync web content to S3
        run: |
          subdirs=(data age-manager)
          for cfg in web/*/config.json; do
            site=$(basename "$(dirname "$cfg")")
            [ "$site" = main ] || subdirs+=("$site")
          done

          excludes=()
          for d in "${subdirs[@]}"; do excludes+=(--exclude "$d/*"); done

          echo "Syncing web/main to s3://$BUCKET"
          aws s3 sync ./web/main/ "s3://$BUCKET" --delete "${excludes[@]}"

          for d in "${subdirs[@]}"; do
            echo "Syncing web/$d to s3://$BUCKET/$d"
            aws s3 sync "./web/$d/" "s3://$BUCKET/$d" --delete
          done

      # "/*" already covers every prefix, so one invalidation is enough.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
