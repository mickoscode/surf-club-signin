name: Terraform drift check

# Weekly check that the live AWS resources still match the Terraform on main. A plan with changes
# fails the run, and GitHub emails you about failed scheduled workflows. Nothing is ever applied here.
on:
  schedule:
    - cron: "0 21 * * 0" # Sundays 21:00 UTC (Monday morning in Australia)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-drift
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform
  TF_VAR_FILE: tfvars/prod.tfvars

jobs:
  drift:
    name: Terraform drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.16"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -var-file="$TF_VAR_FILE" 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          plan="$RUNNER_TEMP/plan.txt"
          run_url=$(grep -oE 'https://app\.terraform\.io/app/[^[:space:]]+/runs/run-[A-Za-z0-9]+' "$plan" | head -n1)
          {
            echo "### Terraform drift check"
            echo
            case "$EXIT_CODE" in
              0) echo "✅ **No drift.** Live resources match the code on main." ;;
              2) echo "⚠️ **Drift or unapplied changes:** $(grep -E '^Plan: ' "$plan" | tail -n1)"
                 echo
                 echo '```'
                 grep -E '^\s*# .* (will be|must be) ' "$plan" | sed -E 's/^\s+//' | head -n 100
                 echo '```' ;;
              *) echo "❌ **Plan failed.** See the job log." ;;
            esac
            echo
            if [ -n "$run_url" ]; then echo "🔗 [Full plan output in Terraform Cloud]($run_url)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$EXIT_CODE" = "0" ]
