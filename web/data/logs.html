<!DOCTYPE html>
<html>
<head>
  <title>Log Viewer</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <h1>Log Entries for Sorrento Youth Sunday</h1>
  <button id="fetchLogsButton">Fetch Logs</button>
  <table id="logTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Direction</th>
        <th>Date/Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr>

  <h2>Add Log Entry</h2>
  <form id="addLogForm">
    <label for="name_id">Name ID (sanitized)</label>
    <input type="text" id="name_id" name="name_id" required>

    <label for="direction">Direction</label>
    <select id="direction" name="direction" required>
      <option value="in">In</option>
      <option value="out">Out</option>
    </select>

    <label for="date_time">Date/Time (ISO format)</label>
    <input type="text" id="date_time" name="date_time" placeholder="2025-08-12T11:15:00Z" required>

    <button type="submit">Add Log</button>
  </form>

  <div id="message"></div>

  <script src="logs.js"></script>
</body>
</html>
