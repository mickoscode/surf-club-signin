<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{INJECT_PAGE_TITLE}}</title>
    <link rel="stylesheet" href="https://unpkg.com/picnic">
    <link rel="stylesheet" href="sign-in-out.css">
    <link rel="icon" type="image/png" sizes="32x32" href="{{INJECT_FAVICON}}">
</head>
<body data-api-url="{{INJECT_API_URL}}" data-activity-id="{{INJECT_ACTIVITY_ID}}" data-test-mode="{{INJECT_ENABLE_TEST_MODE}}">
    <div id="header-container"></div>
    <div class="container">
        <h1 id="message"></h1>
        <form id="signForm" class="hidden">
            <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
            <button type="button" id="clearName">Clear Name</button>
            <input type="hidden" id="direction">
            <input type="hidden" id="name_id">
            <button type="submit" id="submitButton"></button>
        </form>
        <div id="spinner" class="spinner hidden"></div>
    </div>
    <script src="common.js"></script>
    <script src="index.js"></script>
</body>
</html>
