<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Counter</title>
    <link rel="stylesheet" href="vendor/picnic.min.css">
    <link rel="stylesheet" href="sign-in-out.css">
    <link rel="icon" type="image/png" sizes="32x32" href="{{INJECT_FAVICON}}">
</head>
<body data-api-url="{{INJECT_API_URL}}" data-activity-id="{{INJECT_ACTIVITY_ID}}" data-test-mode="{{INJECT_ENABLE_TEST_MODE}}">
    <div id="header-container"></div>
    <div class="container">
        <h2 class="live-total" id="liveTotal">0</h2>
        <p class="message" id="liveMessage">live count as of --:--</p>
        <div class="buttons" id="filterButtons"></div>
        <table class="records-table">
            <tbody id="recordsTable"></tbody>
        </table>
    </div>
    <script src="common.js"></script>
    <script src="live.js"></script>
</body>
</html>
