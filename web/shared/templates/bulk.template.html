<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bulk sign-in-out</title>
    <link rel="stylesheet" href="vendor/picnic.min.css">
    <link rel="stylesheet" href="./sign-in-out.css">
    <link rel="icon" type="image/png" sizes="32x32" href="{{INJECT_FAVICON}}">
</head>
<body data-api-url="{{INJECT_API_URL}}" data-activity-id="{{INJECT_ACTIVITY_ID}}" data-test-mode="{{INJECT_ENABLE_TEST_MODE}}">
    <div id="header-container"></div>
    <div class="container">
        <h1 id="message"></h1>
        <div class="buttons" id="filterButtons"></div>
        <form id="bulkForm" class="hidden">
            <input type="hidden" id="direction">
            <input type="hidden" id="activity_id" value="{{INJECT_ACTIVITY_ID}}">
            <div class="table-scroll">
                <table id="namesTable" class="records-table">
                    <thead> <tr> <th>name</th> <th>in</th> <th>out</th> </tr> </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button type="submit" id="bulkSubmitButton"></button>
        </form>
        <div id="spinner" class="spinner hidden"></div>
    </div>
    <script src="common.js"></script>
    <script src="bulk.js"></script>
</body>
</html>
